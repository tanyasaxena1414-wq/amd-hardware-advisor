[project]
name = "amd-hardware-advisor"
version = "0.0.1"
description = "RAG-powered AI assistant for AMD hardware questions, comparisons, and workload recommendations."
readme = "PRD.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "AMD Hardware Advisor Team" }]

dependencies = [
    # P0: config + logging
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=24.4,<25",
    # P1: ingestion + catalogue
    "pypdf>=5.0,<6",
    "httpx>=0.27,<1",
    "selectolax>=0.3,<1",
    "pyyaml>=6.0,<7",
    # P2: embeddings + vector store
    "sentence-transformers>=3.0,<4",
    "chromadb>=0.5,<1",
    # P3: LLM client / OpenAI compatible
    "openai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<6",
    "fpdf2>=2.8,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amd_hardware_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that require external network access (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
